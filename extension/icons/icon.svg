<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="nGradLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B20710" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
    <linearGradient id="nGradRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B20710" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
    <linearGradient id="nGradCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#B80611" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E50914" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Premium rounded card background with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#E50914" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Iconic Netflix 'N' Logo with cinematic depth -->
  <g filter="url(#glow)">
    <!-- Left Vertical Bar -->
    <path d="M19 14 H27 V50 H19 Z" fill="url(#nGradLeft)" />
    <!-- Right Vertical Bar -->
    <path d="M37 14 H45 V50 H37 Z" fill="url(#nGradRight)" />
    <!-- Center Diagonal Ribbon (cast shadow effect) -->
    <path d="M19 14 H27 L45 50 H37 Z" fill="url(#nGradCenter)" />
  </g>

  <!-- Subtle bookmark/checkmark accent badge at bottom right -->
  <circle cx="48" cy="48" r="7" fill="#E50914" stroke="#181818" stroke-width="1.5" />
  <path d="M45 48 L47.2 50.2 L51.2 45.8" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>